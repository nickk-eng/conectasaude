<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Recuperar senha | ConectaSaúde</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="container">
<div class="logo"><img src="/img/coracao.png" alt="Logo do ConectaSaúde"></div>
<h1>Recuperar senha</h1>
<p>Receba um código por e-mail para recuperar sua senha.</p>
<form id="form-solicitar-codigo">
<label for="email-envio">E-mail da conta</label>
<input id="email-envio" name="email" type="email" autocomplete="email" maxlength="150" required>
<button class="botao-enviar" type="submit">Enviar código</button>
</form>
<form id="form-verificar-codigo">
<label for="codigo-recuperacao">Código recebido por e-mail</label>
<input id="codigo-recuperacao" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
<button class="botao-enviar" type="submit">Continuar</button>
</form>
<p id="mensagem-recuperacao" class="mensagem" role="status" aria-live="polite"></p>
<p><a href="/">Voltar para entrar</a></p>
</main><script src="/js/solicitar-redefinicao.js"></script></body></html>
